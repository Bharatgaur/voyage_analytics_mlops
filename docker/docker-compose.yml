# ============================================================
# docker-compose.yml — Travel ML Project
# Full local development stack
#
# Usage:
#   docker-compose up --build          # start everything
#   docker-compose up api              # only Flask API
#   docker-compose up streamlit        # only Streamlit
# ============================================================

version: "3.9"

services:

  # ── Model Training (runs once, then exits) ────────────────
  trainer:
    build: .
    container_name: travel_ml_trainer
    environment:
      - APP_MODE=train
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./mlruns:/app/mlruns

  # ── Flask REST API ─────────────────────────────────────────
  api:
    build: .
    container_name: travel_ml_api
    environment:
      - APP_MODE=api
      - PORT=5000
      - DEBUG=false
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models:ro
      - ./mlruns:/app/mlruns:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      trainer:
        condition: service_completed_successfully

  # ── Streamlit Web App ─────────────────────────────────────
  streamlit:
    build: .
    container_name: travel_ml_streamlit
    environment:
      - APP_MODE=streamlit
      - API_URL=http://api:5000
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    depends_on:
      - api

  # ── MLflow Tracking Server ─────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: travel_mlflow_server
    command: >
      bash -c "pip install mlflow &&
               mlflow server
               --backend-store-uri /mlruns
               --default-artifact-root /mlruns
               --host 0.0.0.0
               --port 5001"
    ports:
      - "5001:5001"
    volumes:
      - ./mlruns:/mlruns

volumes:
  models:
  mlruns:
